<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Nyay Apex</title>
<style>
  :root { --bg: #f5f7ff; --ink: #0b2d6b; --muted: #5b6475; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161a22; --ink: #e8ecf3; --muted: #9aa3b2; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 0 16px; text-align: center; }
  img { width: 64px; height: 64px; border-radius: 14px; }
  p { color: var(--muted); max-width: 22rem; }
  button { margin-top: 8px; padding: 10px 18px; border: 0; border-radius: 8px; background: #0b2d6b; color: #fff; font: inherit; }
</style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="">
    <h1>You are offline</h1>
    <p>Nyay Apex needs the internet to open your matters. Case data is never stored on this phone.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
